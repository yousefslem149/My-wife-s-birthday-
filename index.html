<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألفة 🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17112b;
  --plum:#2b1f4d;
  --moon:#f4efdc;
  --lilac:#b9a2ff;
  --rose:#ff93b4;
  --text:#f4efdc;
  --muted:#c9c0e6;
  --display:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--night);
  color:var(--text);
  font-family:var(--body);
  line-height:1.8;
  min-height:100svh;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}

/* ---------- Lock screen ---------- */
#lock{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4rem;padding:2rem;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%, var(--plum) 0%, var(--night) 70%);
  transition:opacity .9s ease, visibility .9s;
}
#lock.gone{opacity:0;visibility:hidden}
.moon{
  width:min(52vw,230px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 32% 30%, #fffdf2 0%, var(--moon) 45%, #d9d1b4 100%);
  box-shadow:0 0 60px 12px rgba(244,239,220,.28), 0 0 160px 40px rgba(185,162,255,.22);
  position:relative;
  animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both;
}
.moon::before,.moon::after{
  content:"";position:absolute;border-radius:50%;background:rgba(120,105,80,.16);
}
.moon::before{width:22%;height:22%;top:22%;left:56%}
.moon::after{width:14%;height:14%;top:58%;left:30%}
@keyframes rise{
  from{transform:translateY(60px);opacity:0}
  to{transform:none;opacity:1}
}
#lock h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,3rem);line-height:1.3}
#lock p{color:var(--muted);max-width:22rem}
#gate{display:flex;flex-direction:column;gap:.8rem;width:min(100%,19rem)}
#pw{
  font:inherit;font-size:1.1rem;text-align:center;
  padding:.85rem 1rem;border-radius:999px;
  border:1.5px solid rgba(244,239,220,.35);
  background:rgba(255,255,255,.07);color:var(--text);
}
#pw::placeholder{color:rgba(244,239,220,.55)}
#go{
  font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
  padding:.85rem 1rem;border-radius:999px;border:0;
  background:var(--moon);color:var(--night);
}
#go:active{transform:scale(.97)}
#err{min-height:1.6rem;color:var(--rose);font-size:.95rem}
.shake{animation:shake .4s}
@keyframes shake{
  20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}
}

/* ---------- Music chip ---------- */
#chip{
  position:fixed;z-index:40;top:max(.8rem,env(safe-area-inset-top));inset-inline-start:.8rem;
  display:none;align-items:center;gap:.5rem;
  font:inherit;font-size:.95rem;color:var(--text);cursor:pointer;
  padding:.45rem .9rem;border-radius:999px;
  background:rgba(23,17,43,.72);backdrop-filter:blur(8px);
  border:1px solid rgba(244,239,220,.25);
}
body.open #chip{display:flex}
#chip .ico{font-size:1rem}

/* ---------- Story ---------- */
main{display:none}
body.open main{display:block}
section{
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4rem;padding:4.5rem 1.4rem 3rem;text-align:center;
}
.hero{
  background:radial-gradient(110% 80% at 50% 0%, var(--plum) 0%, var(--night) 75%);
}
.hero h2{
  font-family:var(--display);font-weight:700;
  font-size:clamp(3.4rem,17vw,7rem);line-height:1.15;
}
.hero .wish{font-size:clamp(1.2rem,5vw,1.6rem);color:var(--moon)}
.count{
  display:inline-flex;flex-direction:column;align-items:center;
  padding:1rem 1.8rem;border-radius:1.2rem;
  border:1.5px solid rgba(185,162,255,.5);
}
.count b{font-family:var(--display);font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.2;color:var(--lilac)}
.count span{color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);font-size:.9rem;margin-top:.5rem}

.frame{
  width:min(100%,26rem);
  border-radius:1.4rem;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  background:var(--plum);
}
.frame img,.frame video{display:block;width:100%;height:auto}
.frame.tall{width:min(78vw,19rem)}
.cap{font-family:var(--display);font-size:clamp(1.5rem,6vw,2rem);line-height:1.6;max-width:20rem}
.sub{color:var(--muted);max-width:21rem}

/* ---------- Finale ---------- */
.finale{
  background:radial-gradient(110% 80% at 50% 100%, var(--plum) 0%, var(--night) 75%);
  position:relative;overflow:hidden;
}
.finale h3{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,10vw,3.8rem);line-height:1.4}
#nour{
  font-family:var(--display);font-weight:700;font-size:1.5rem;cursor:pointer;
  padding:.8rem 2.6rem;border-radius:999px;border:0;
  background:linear-gradient(135deg,var(--rose),var(--lilac));color:var(--night);
}
#nour:active{transform:scale(.96)}
#love{
  max-width:21rem;color:var(--moon);font-size:1.15rem;
  opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease;
  min-height:5rem;
}
#love.show{opacity:1;transform:none}
.heart{
  position:absolute;bottom:-2rem;pointer-events:none;
  animation:float 3.2s ease-out forwards;
}
@keyframes float{
  to{transform:translateY(-110vh) rotate(18deg);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  .moon{animation:none}
  .heart{display:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body class="locked">

<!-- ========== شاشة الباسورد ========== -->
<div id="lock">
  <div class="moon" aria-hidden="true"></div>
  <h1>ألفة 🌙</h1>
  <p>فيه حاجة مستنياكي جوه. اكتبي الباسورد.</p>
  <form id="gate" autocomplete="off">
    <input id="pw" type="text" inputmode="numeric" placeholder="تاريخ اكتمال القمر 🌕" aria-label="الباسورد">
    <button id="go" type="submit">افتحي</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<button id="chip" type="button" aria-label="تشغيل أو إيقاف الأغنية">
  <span class="ico" id="chipIco">♪</span><span>نور عيني</span>
</button>

<audio id="song" src="music.mp3" loop preload="auto"></audio>

<main>
  <!-- ========== البداية ========== -->
  <section class="hero">
    <h2>ألفة</h2>
    <p class="wish">كل سنة وانتي طيبة</p>
    <div class="count">
      <b id="days">0</b>
      <span>يوم من يوم 19 يوليو</span>
    </div>
    <p class="hint">انزلي تحت</p>
  </section>

  <!-- ========== صورة 1 ========== -->
  <section>
    <div class="frame"><img src="photo1.jpg" alt="ألفة" loading="lazy"></div>
    <p class="cap">أحلى ضحكة في الدنيا</p>
    <p class="sub">ولسه فاكر أول مرة شفتها فيها.</p>
  </section>

  <!-- ========== فيديو 1 ========== -->
  <section>
    <div class="frame tall"><video src="video1.mp4" muted loop playsinline preload="metadata"></video></div>
    <p class="cap">وحتى وانتي بتهزري</p>
    <p class="sub">بتبقي أحلى.</p>
  </section>

  <!-- ========== صورة 2 ========== -->
  <section>
    <div class="frame tall"><img src="photo2.jpg" alt="ألفة" loading="lazy"></div>
    <p class="cap">وبوزك ده بالذات</p>
    <p class="sub">بحبه أكتر مما تتخيلي.</p>
  </section>

  <!-- ========== فيديو 2 ========== -->
  <section>
    <div class="frame tall"><video src="video2.mp4" muted loop playsinline preload="metadata"></video></div>
    <p class="cap">كل لحظة معاكي</p>
    <p class="sub">حاجة بتتحفظ.</p>
  </section>

  <!-- ========== النهاية ========== -->
  <section class="finale" id="finale">
    <h3>كل سنة وانتي طيبة يا ألوفتي</h3>
    <button id="nour" type="button">نور عيني</button>
    <p id="love"></p>
  </section>
</main>

<script>
/* ============ إعدادات سهلة التعديل ============ */
const CONFIG = {
  // الباسورد: اكتب أي عدد من الاحتمالات (بالأرقام بس، من غير مسافات أو شرطات).
  // بيتقبل أي شكل: 22/11/2007 أو 22-11-2007 أو 22112007 أو بالأرقام العربي، كلها نفس الحاجة
  passwords: ["22112007"],
  wrongMsg: "لا مش هو.. فكّري في القمر تاني 🌙",
  startDate: "2026-07-19",       // تاريخ بداية العلاقة
  finalLine: "بحبك يا ألفة. ودايماً هفضل أقولهالك."  // الجملة اللي بتظهر بعد زرار نور عيني
};
/* ============================================== */

const $ = id => document.getElementById(id);
const song = $("song");
const lock = $("lock");

// تحويل الأرقام العربية لإنجليزي وشيل أي حاجة مش رقم
function norm(s){
  return s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
          .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
          .replace(/\D/g, "");
}

$("gate").addEventListener("submit", e => {
  e.preventDefault();
  const v = norm($("pw").value);
  if (CONFIG.passwords.map(norm).includes(v)) {
    unlock();
  } else {
    $("err").textContent = CONFIG.wrongMsg;
    const g = $("gate");
    g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
  }
});

function unlock(){
  document.body.classList.remove("locked");
  document.body.classList.add("open");
  lock.classList.add("gone");
  song.play().then(()=>setChip(true)).catch(()=>setChip(false));
  startCounter();
  watchVideos();
}

// ---- زرار الأغنية ----
function setChip(playing){ $("chipIco").textContent = playing ? "❚❚" : "♪"; }
$("chip").addEventListener("click", () => {
  if (song.paused) { song.play(); setChip(true); }
  else { song.pause(); setChip(false); }
});

// ---- عداد الأيام ----
function startCounter(){
  const start = new Date(CONFIG.startDate + "T00:00:00");
  const days = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
  const el = $("days");
  const target = days;
  let n = 0;
  const step = Math.max(1, Math.ceil(target / 60));
  const t = setInterval(() => {
    n = Math.min(target, n + step);
    el.textContent = n;
    if (n >= target) clearInterval(t);
  }, 25);
}

// ---- الفيديوهات بتشتغل لما تبان على الشاشة ----
function watchVideos(){
  const vids = document.querySelectorAll("video");
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) en.target.play().catch(()=>{});
      else en.target.pause();
    });
  }, { threshold: .5 });
  vids.forEach(v => io.observe(v));
}

// ---- زرار نور عيني ----
$("nour").addEventListener("click", () => {
  const love = $("love");
  love.textContent = CONFIG.finalLine;
  love.classList.add("show");
  if (song.paused) { song.currentTime = 0; song.play(); setChip(true); }
  burst();
});

function burst(){
  const box = $("finale");
  const icons = ["💜","🤍","🌙","💗"];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = icons[i % icons.length];
    h.style.left = Math.random() * 92 + "%";
    h.style.fontSize = (1 + Math.random() * 1.4) + "rem";
    h.style.animationDelay = (Math.random() * .9) + "s";
    box.appendChild(h);
    setTimeout(() => h.remove(), 4500);
  }
}
</script>
</body>
</html>
